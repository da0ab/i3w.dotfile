[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[settings]
screenchange-reload = true
pseudo-transparency = true
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[bar/main]
; ─── Geometry ───────────────────────────────────────────
width = 100%
height = 24pt
radius = 6

; ─── Colors ─────────────────────────────────────────────
background = ${colors.background}
foreground = ${colors.foreground}

; ─── Borders ────────────────────────────────────────────
line-size = 3pt
border-size = 0

; ─── Spacing ────────────────────────────────────────────
padding-left = 3
padding-right = 3
module-margin = 3

; ─── Separators ─────────────────────────────────────────
separator = |
separator-foreground = ${colors.disabled}

; ─── Module Layout ──────────────────────────────────────
modules-left = date wifi pulseaudio
modules-center = xworkspaces
modules-right = xkeyboard battery


; ────────────────────────────────────────────────────────
; MODULES: SYSTEM
; ────────────────────────────────────────────────────────

[module/date]
type = internal/date
interval = 5
locale = ru_RU.UTF-8
date = %a %d %b
time = %H:%M
format = <label>
label = %date% / %time%


[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery-status.sh
interval = 30
label = %output%

; ────────────────────────────────────────────────────────
; MODULES: NETWORK
; ────────────────────────────────────────────────────────


[module/wifi]
type = internal/network
interface = wlp0s20f3
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:nm-connection-editor:}%essid% %signal%%%{A}
label-disconnected = %{A1:nm-connection-editor:}потерялся%{A}
label-disconnected-foreground = #ff5555

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%


; ────────────────────────────────────────────────────────
; MODULES: AUDIO
; ────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "ГРОМКОСТЬ "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = тишина
label-muted-foreground = ${colors.disabled}


; ────────────────────────────────────────────────────────
; MODULES: WINDOW MANAGEMENT
; ────────────────────────────────────────────────────────

[module/xworkspaces]
type = internal/xworkspaces

; Active workspace
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

; Occupied workspace
label-occupied = %name%
label-occupied-padding = 1

; Urgent workspace
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; Empty workspace
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/xwindow]
type = internal/xwindow
label = %title:0:60:...


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}


; ────────────────────────────────────────────────────────
; BASE TEMPLATES
; ────────────────────────────────────────────────────────

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#dd2121} DOWN
